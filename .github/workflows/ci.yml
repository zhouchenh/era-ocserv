name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  release-artifacts:
    # Build release artifacts on tag push only. PRs and main pushes stay fast.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: build era-ocserv
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" \
            -o dist/era-ocserv-${GOOS}-${GOARCH} \
            ./cmd/era-ocserv
      - name: stage deploy harness
        run: |
          cp deploy/era-ocserv.service       dist/
          cp deploy/era-ocserv-setup.sh      dist/
          cp deploy/era-ocserv-teardown.sh   dist/
          chmod +x dist/era-ocserv-setup.sh dist/era-ocserv-teardown.sh
      - uses: actions/upload-artifact@v4
        with:
          name: era-ocserv-${{ matrix.goarch }}-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
